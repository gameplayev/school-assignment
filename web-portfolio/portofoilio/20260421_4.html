<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>if-else</title></head>

<body>
    <a class="main-home-button" href="../index.html" style="position: fixed; right: 16px; top: 16px; z-index: 9999; display: inline-block; padding: 10px 14px; border: 1px solid #111827; border-radius: 6px; background: aqua; color: #111827; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; line-height: 1; text-decoration: none; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);">메인으로 돌아가기</a>

<h3>if-else를 이용한 학점 매기기</h3>

<hr>

<script>

	let grade;

	let score = prompt("황기태 님 점수를 입력하세요", 100);

	score = parseInt(score); // 문자열을 숫자로 바꿈

	

	// 이곳에 자바스크립트 코드를 작성하라.
    if(score >= 90) grade = 'A';
    else if(score >= 80) grade = 'B';
    else if(score >= 70) grade = 'C';
    else if(score >= 60) grade = 'D';
    else if(score >= 50) grade = 'E';


    else grade='F'

	

	document.write(score + "는 " + grade + "입니다.<br>")

</script>

</body>

</html>
