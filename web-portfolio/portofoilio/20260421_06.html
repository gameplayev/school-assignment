<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function printStar(value){
            for(let i = 1;i<=value;i++){
                for(let j = 0;j<i;j++){
                    document.write("*")
                }
                document.write("<br>")
            }

        
        }
    </script>
</head>
<body>
    <a class="main-home-button" href="../index.html" style="position: fixed; right: 16px; top: 16px; z-index: 9999; display: inline-block; padding: 10px 14px; border: 1px solid #111827; border-radius: 6px; background: aqua; color: #111827; font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; line-height: 1; text-decoration: none; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);">메인으로 돌아가기</a>
    <script>
        document.write("<h1> 별 문자 출력하기")
        let val = prompt("정수를 입력하세요");
        document.write("<hr>")
        if(val > 0){
            printStar(val);
        }
        else{
            document.write("올바르지 않는 입력값")
        }
    </script>
</body>
</html>
